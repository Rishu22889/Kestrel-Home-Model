<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claim Review</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#5f6b7a; --line:#dde2e8;
          --high:#b42318; --high-bg:#fdecea; --med:#9a6700; --med-bg:#fff6dc;
          --low:#1a7f37; --low-bg:#e8f5ec; --accent:#2457c5; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 3px; }
  input, select { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px;
                  font:inherit; background:#fff; color:var(--ink); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { margin-top:14px; padding:9px 16px; border:0; border-radius:6px; background:var(--accent);
           color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  .badge { display:inline-block; padding:3px 10px; border-radius:99px; font-weight:600; font-size:13px; }
  .high { color:var(--high); background:var(--high-bg); }
  .medium { color:var(--med); background:var(--med-bg); }
  .low { color:var(--low); background:var(--low-bg); }
  .score { font-size:34px; font-weight:700; margin:6px 0; font-variant-numeric: tabular-nums; }
  ul { padding-left:18px; } li { margin:6px 0; }
  .note { color:var(--muted); font-size:13px; border-top:1px solid var(--line); padding-top:10px; }
  .err { color:var(--high); }
  .bad { border-color:var(--high); background:var(--high-bg); }
</style>
</head>
<body>
<main>
  <h1>Warranty claim review</h1>
  <p class="sub">Scores one claim for the investigation queue (desk capacity: 40 claims a month).
     A high score means "look at this first", not "this is fraud".</p>
  <div class="grid">
    <form class="card" id="f" novalidate>
      <label>Load a stored claim</label>
      <select id="ex"><option value="">- choose an example -</option></select>
      <div class="row">
        <div><label>Partner</label><select name="partner_id" id="partner_id"></select></div>
        <div><label>SKU</label><select name="sku" id="sku"></select></div>
      </div>
      <div class="row">
        <div><label>Claim amount (Rs)</label><input name="claim_amount_inr" type="number" min="1" step="any" value="1500" required></div>
        <div><label>Days since purchase</label><input name="days_since_purchase" type="number" min="0" value="120" required></div>
      </div>
      <div class="row">
        <div><label>Customer's earlier claims</label><input name="customer_prior_claims" type="number" min="0" value="0" required></div>
        <div><label>Submitted at (IST)</label><input name="submitted_at" value="2026-07-15 11:00" required></div>
      </div>
      <label>Product serial</label><input name="product_serial" value="KH123456789" required>
      <div class="row">
        <div><label>Photo attached</label><select name="photo_attached"><option>Y</option><option>N</option></select></div>
        <div><label>Partner inspected</label><select name="partner_inspected"><option>N</option><option>Y</option></select></div>
      </div>
      <label>Fault description</label><input name="claim_description" value="motor not running" required>
      <input type="hidden" name="claim_id"><input type="hidden" name="inspector_note">
      <button type="submit">Score claim</button>
    </form>
    <section class="card" id="out"><p class="sub">Result appears here.</p></section>
  </div>
</main>
<script>
const f = document.getElementById('f'), out = document.getElementById('out');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function init() {
  const r = await fetch('/options');
  if (!r.ok) { out.innerHTML = `<p class="err">${esc((await r.json()).detail)}</p>`; return; }
  const o = await r.json();
  const fill = (id, xs) => document.getElementById(id).innerHTML = xs.map(x => `<option>${esc(x)}</option>`).join('');
  fill('partner_id', o.partners); fill('sku', o.skus);
  document.getElementById('ex').innerHTML += o.examples.map(x => `<option>${esc(x)}</option>`).join('');
}

document.getElementById('ex').onchange = async e => {
  if (!e.target.value) return;
  const c = await (await fetch('/example/' + e.target.value)).json();
  for (const [k, v] of Object.entries(c)) if (f.elements[k]) f.elements[k].value = v ?? '';
  f.elements.claim_id.value = c.claim_id;
};

const LABELS = { partner_id:'Partner', sku:'SKU', claim_amount_inr:'Claim amount', days_since_purchase:'Days since purchase',
  customer_prior_claims:"Customer's earlier claims", submitted_at:'Submitted at', product_serial:'Product serial',
  claim_description:'Fault description', photo_attached:'Photo attached', partner_inspected:'Partner inspected' };
const showErrors = msgs => out.innerHTML =
  `<p class="err"><strong>Cannot score this claim yet:</strong></p><ul class="err">${msgs.map(m => `<li>${esc(m)}</li>`).join('')}</ul>`;

f.oninput = e => e.target.classList.remove('bad');

f.onsubmit = async e => {
  e.preventDefault();
  // client-side check first: empty or invalid fields are named, never silently sent as 0 / ""
  const problems = [];
  for (const el of f.querySelectorAll('[required]')) {
    el.classList.remove('bad');
    if (!el.value.trim()) { problems.push(`${LABELS[el.name]} is missing`); el.classList.add('bad'); }
    else if (!el.checkValidity()) { problems.push(`${LABELS[el.name]}: ${el.validationMessage}`); el.classList.add('bad'); }
  }
  if (problems.length) return showErrors(problems);

  const d = Object.fromEntries(new FormData(f));
  for (const k of ['claim_amount_inr','days_since_purchase','customer_prior_claims']) d[k] = Number(d[k]);
  for (const k of ['claim_id','inspector_note']) if (!d[k]) delete d[k];
  out.innerHTML = '<p class="sub">Scoring...</p>';
  let r, j;
  try {
    r = await fetch('/predict', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(d)});
    j = await r.json();
  } catch (err) { return showErrors(['Could not reach the service. Is the server running?']); }
  if (!r.ok) {
    // FastAPI 422 = list of {loc, msg}; 503/other = string
    const msgs = Array.isArray(j.detail)
      ? j.detail.map(x => `${LABELS[x.loc[x.loc.length - 1]] || x.loc.join('.')}: ${x.msg}`)
      : [j.detail || `Error ${r.status}`];
    return showErrors(msgs);
  }
  const c = j.context;
  const rank = c.rank_in_month ? `Ranks ${c.rank_in_month} of ${c.claims_in_month} claims this month (desk capacity ${c.monthly_capacity}).`
                               : `No other claims stored for this month; score marker is ${c.score_marker}.`;
  out.innerHTML = `
    <span class="badge ${j.risk_level}">${j.risk_level.toUpperCase()} priority</span>
    <div class="score">${j.risk_score.toFixed(3)}</div>
    <p class="sub">Relative risk score (not a probability). ${esc(rank)}</p>
    <p><strong>${esc(j.recommendation)}</strong></p>
    <p>Why:</p><ul>${j.reasons.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    <p class="note">${esc(j.note)}</p>`;
};
init();
</script>
</body>
</html>
